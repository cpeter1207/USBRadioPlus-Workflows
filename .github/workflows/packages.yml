name: Publish Debian packages

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      package_version:
        required: true
        type: string
      package_revision:
        required: false
        default: "1"
        type: string
      include_debian12:
        description: Build Debian 12 packages through an explicit manual caller.
        required: false
        default: false
        type: boolean
    secrets:
      APT_SIGNING_KEY:
        required: true

permissions:
  contents: write
  checks: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  select_package_matrix:
    name: Select package platforms
    runs-on: ubuntu-24.04
    outputs:
      build_matrix: ${{ steps.select.outputs.build_matrix }}
      verify_matrix: ${{ steps.select.outputs.verify_matrix }}
    steps:
      - id: select
        shell: bash
        env:
          INCLUDE_DEBIAN12: ${{ inputs.include_debian12 }}
        run: |
          set -euo pipefail
          # Debian 12 remains available only when an explicit manual caller
          # requests it; ordinary releases publish Debian 13 artifacts alone.
          build_matrix='{"include":[{"debian":"13","suite":"trixie","runner":"ubuntu-24.04"},{"debian":"13","suite":"trixie","runner":"ubuntu-24.04-arm"}]}'
          verify_matrix='{"include":[{"debian":"13","suite":"trixie","runner":"ubuntu-24.04","asl":"3.9.3"},{"debian":"13","suite":"trixie","runner":"ubuntu-24.04","asl":"3.10.5"},{"debian":"13","suite":"trixie","runner":"ubuntu-24.04-arm","asl":"3.9.3"},{"debian":"13","suite":"trixie","runner":"ubuntu-24.04-arm","asl":"3.10.5"}]}'
          if [[ "$INCLUDE_DEBIAN12" == "true" ]]; then
            build_matrix='{"include":[{"debian":"13","suite":"trixie","runner":"ubuntu-24.04"},{"debian":"13","suite":"trixie","runner":"ubuntu-24.04-arm"},{"debian":"12","suite":"bookworm","runner":"ubuntu-24.04"},{"debian":"12","suite":"bookworm","runner":"ubuntu-24.04-arm"}]}'
          fi
          printf 'build_matrix=%s\n' "$build_matrix" >> "$GITHUB_OUTPUT"
          printf 'verify_matrix=%s\n' "$verify_matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: select_package_matrix
    env:
      DEBFULLNAME: USBRadioPlus Archive
      DEBEMAIL: cpeter1207@users.noreply.github.com
      # The merged source has already passed the full platform gate.
      DEB_BUILD_OPTIONS: nocheck
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select_package_matrix.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    container: debian:${{ matrix.debian }}
    steps:
      - name: Install checkout tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates git gh jq
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - name: Trust checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Require the previously passed pull-request gate
        uses: cpeter1207/USBRadioPlus-Workflows/actions/verify-main-gate@main
      - name: Install ASL3 repository and package tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y wget devscripts \
            debhelper dh-autoreconf build-essential pkg-config python3-pytest \
            lintian ladspa-sdk libsamplerate0-dev libavfilter-dev libavutil-dev \
            libasound2-dev libusb-1.0-0-dev
          wget -qO /tmp/asl-repo.deb \
            "https://repo.allstarlink.org/public/asl-apt-repos.deb${{ matrix.debian }}_all.deb"
          dpkg -i /tmp/asl-repo.deb
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            'asl3-asterisk-dev=2:22.9.0+asl3-3.9.3-1.deb${{ matrix.debian }}'
      - name: Install released shared dependencies
        if: matrix.debian == '13'
        id: shared
        uses: cpeter1207/USBRadioPlus-Workflows/actions/install-shared-dependencies@main
      - name: Install manually published Debian 12 dependencies
        if: matrix.debian == '12'
        run: |
          install -d /etc/apt/keyrings
          install -m 0644 packaging/repository/usbradioplus-archive-keyring.gpg \
            /etc/apt/keyrings/usbradioplus.gpg
          printf '%s\n' 'deb [signed-by=/etc/apt/keyrings/usbradioplus.gpg] https://cpeter1207.github.io/USBRadioPlus bookworm main' \
            > /etc/apt/sources.list.d/usbradioplus.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            librate-adjusting-pcm-ring-dev librptadvradio-dev \
            librptadv-samplerate-adapter-dev librptadv-ffmpeg-adapter-dev \
            librptadv-portaudio-alsa-adapter-dev librptadv-gpio-adapter-dev
      - name: Install RNNoise companion packages
        id: rnnoise
        uses: cpeter1207/USBRadioPlus-Workflows/actions/install-rnnoise-packages@main
        with:
          debian: ${{ matrix.debian }}
          suite: ${{ matrix.suite }}
      - name: Build USBRadioPlus package
        id: usbradioplus_build
        run: |
          set -eux
          package_version='${{ inputs.package_version }}'
          test -n "$package_version" || package_version=$(cat VERSION)
          asl_version=$(dpkg-query -W -f='${Version}' asl3-asterisk)
          test "$asl_version" = '2:22.9.0+asl3-3.9.3-1.deb${{ matrix.debian }}'
          dch --newversion "$package_version-${{ inputs.package_revision }}.deb${{ matrix.debian }}" \
            --distribution "${{ matrix.suite }}" "Build for Debian ${{ matrix.debian }}."
          dpkg-buildpackage -b -us -uc
          lintian --fail-on error ../usbradioplus_*.changes
          mkdir -p package-output
          cp ../usbradioplus_*.deb package-output/
          cp "${{ steps.rnnoise.outputs.package-directory }}"/librnnoise0_*.deb \
            "${{ steps.rnnoise.outputs.package-directory }}"/librnnoise-dev_*.deb package-output/
          if test '${{ matrix.debian }}' = 13; then
            cp "${{ steps.shared.outputs.package-directory }}"/*.deb package-output/
          fi
          find .. -maxdepth 1 -name 'usbradioplus-dbgsym_*.deb' \
            -exec cp -t package-output {} +
          printf 'suite=%s\narchitecture=%s\nasl3_build=%s\n' \
            '${{ matrix.suite }}' "$(dpkg --print-architecture)" \
            "$asl_version" > package-output/build-info.txt
          test "$(dpkg-deb -f ../usbradioplus_*.deb Depends | \
            grep -c "asl3-asterisk (= $asl_version)")" = 1
          test "$(dpkg-deb -f ../usbradioplus_*.deb Package)" = usbradioplus
          for library in librate-adjusting-pcm-ring1 librptadvradio1 \
            librptadv-samplerate-adapter1 librptadv-ffmpeg-adapter1 \
            librptadv-portaudio-alsa-adapter1 librptadv-gpio-adapter1; do
            dpkg-deb -f ../usbradioplus_*.deb Depends | grep -F "$library"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.suite }}-${{ runner.arch }}
          path: package-output/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    env:
      ARTIFACT_DIR: /tmp/usbradioplus-package-artifacts
      INCOMING_DIR: /tmp/usbradioplus-package-incoming
      PUBLIC_DIR: /tmp/usbradioplus-package-public
      SITE_DIR: /tmp/usbradioplus-package-site
      OLD_REPO_DIR: /tmp/usbradioplus-old-repository
      INCLUDE_DEBIAN12: ${{ inputs.include_debian12 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: /tmp/usbradioplus-package-artifacts
      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install -y reprepro gnupg
      - name: Import signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          test -n "$APT_SIGNING_KEY"
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
      - name: Build signed repository
        env:
          SIGNING_FINGERPRINT: ${{ vars.APT_SIGNING_FINGERPRINT }}
        run: |
          set -euxo pipefail
          mkdir -p "$INCOMING_DIR" "$PUBLIC_DIR/conf" "$OLD_REPO_DIR"
          # Flatten artifacts deliberately. Identically named files must also
          # be byte-identical; otherwise publishing would be nondeterministic.
          find "$ARTIFACT_DIR" -type f -name '*.deb' -print0 |
            while IFS= read -r -d '' package; do
              destination="$INCOMING_DIR/$(basename "$package")"
              if test -e "$destination"; then
                cmp "$package" "$destination"
              else
                cp "$package" "$destination"
              fi
            done
          test -n "$(find "$INCOMING_DIR" -maxdepth 1 -name '*.deb' -print -quit)"
          git fetch origin apt-repository || true
          if git show-ref --verify --quiet refs/remotes/origin/apt-repository; then
            # Import only the repository's root pool. Older broken snapshots
            # may contain recursively nested public/site trees elsewhere.
            git archive origin/apt-repository pool | tar -x -C "$OLD_REPO_DIR"
            find "$OLD_REPO_DIR/pool" -type f -name '*.deb' \
              -exec cp --no-clobber -t "$INCOMING_DIR" {} + 2>/dev/null || true
          fi
          # Fully decompress every data archive before it can enter the repo.
          for package in "$INCOMING_DIR"/*.deb; do
            dpkg-deb --fsys-tarfile "$package" | tar -tf - >/dev/null
          done
          cp packaging/repository/index.html \
            packaging/repository/install-usbradioplus.sh \
            packaging/repository/usbradioplus-archive-keyring.gpg "$PUBLIC_DIR/"
          chmod 0755 "$PUBLIC_DIR/install-usbradioplus.sh"
          active_suites=(trixie)
          if [[ "$INCLUDE_DEBIAN12" == "true" ]]; then
            active_suites+=(bookworm)
          fi
          for suite in "${active_suites[@]}"; do
            cat >> "$PUBLIC_DIR/conf/distributions" <<EOF
          Origin: USBRadioPlus
          Label: USBRadioPlus
          Codename: $suite
          Suite: $suite
          Architectures: amd64 arm64
          Components: main
          Description: USBRadioPlus alpha packages for ASL3
          SignWith: $SIGNING_FINGERPRINT

          EOF
          done
          for package in "$INCOMING_DIR"/*.deb; do
            case "$package" in
              */usbradioplus-asl3105_*|*/usbradioplus-asl3105-dbgsym_*) continue ;;
              */librate-adjusting-pcm-ring*|*/librptadv*) suite=trixie ;;
              *.deb12_*|*.deb12+*_*)
                if [[ "$INCLUDE_DEBIAN12" != "true" ]]; then
                  continue
                fi
                suite=bookworm
                ;;
              *.deb13_*|*.deb13+*_*) suite=trixie ;;
              *) echo "Cannot select suite for $package" >&2; exit 1 ;;
            esac
            reprepro -b "$PUBLIC_DIR" includedeb "$suite" "$package"
          done
          reprepro -b "$PUBLIC_DIR" export
          cp -a "$PUBLIC_DIR" "$SITE_DIR"
          rm -rf "$SITE_DIR/conf" "$SITE_DIR/db"
          git fetch origin api-documentation || true
          if git show-ref --verify --quiet refs/remotes/origin/api-documentation; then
            mkdir -p "$SITE_DIR/docs"
            git archive origin/api-documentation | tar -x -C "$SITE_DIR/docs"
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          name: usbradioplus-packages-pages
          path: /tmp/usbradioplus-package-site
      - name: Save repository snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch --orphan apt-repository
          git rm -rf --ignore-unmatch .
          git clean -fdx
          cp -a "$PUBLIC_DIR/." .
          touch .nojekyll
          git add .
          git commit -m "Publish USBRadioPlus $(cat VERSION 2>/dev/null || echo packages)"
          git push --force origin HEAD:apt-repository

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: usbradioplus-packages-pages

  verify:
    needs: [deploy, select_package_matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select_package_matrix.outputs.verify_matrix) }}
    runs-on: ${{ matrix.runner }}
    container: debian:${{ matrix.debian }}
    steps:
      - name: Install ASL3 runtime
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl
          curl -fsSLo /tmp/asl-repo.deb \
            "https://repo.allstarlink.org/public/asl-apt-repos.deb${{ matrix.debian }}_all.deb"
          dpkg -i /tmp/asl-repo.deb
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            'asl3-asterisk=2:22.9.0+asl3-3.9.3-1.deb${{ matrix.debian }}'
      - name: Install second supported ASL3 runtime
        if: matrix.asl == '3.10.5'
        uses: cpeter1207/USBRadioPlus-Workflows/actions/install-asl3-3105@main
      - name: Install from the published signed repository
        run: |
          set -eux
          package=usbradioplus
          mkdir -p /tmp/config-before
          cp -a /etc/asterisk/modules.conf /etc/asterisk/rpt.conf /tmp/config-before/ 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            echo "Download attempt $attempt"
            curl -fsSLo /tmp/install-usbradioplus.sh \
              https://cpeter1207.github.io/USBRadioPlus/install-usbradioplus.sh && break
            sleep 10
          done
          sh /tmp/install-usbradioplus.sh --yes
          module_dir=$(dirname "$(dpkg-query -L asl3-asterisk-modules | \
            sed -n '/\/app_rpt\.so$/ { p; q; }')")
          test -n "$module_dir"
          test -f "$module_dir/chan_usbradioplus.so"
          test -x /usr/sbin/usbradioplus-tune
          test -f /usr/share/man/man7/usbradioplus.7.gz
          test "$(dpkg-query -W -f='${db:Status-Status}' \
            librate-adjusting-pcm-ring1)" = installed
          ring_library=$(dpkg-query -L librate-adjusting-pcm-ring1 | \
            sed -n '/\/librate_adjusting_pcm_ring\.so\.1$/ { p; q; }')
          test -n "$ring_library"
          test -f "$ring_library"
          ldd "$module_dir/chan_usbradioplus.so" | \
            grep -F 'librate_adjusting_pcm_ring.so.1' | grep -Fv 'not found'
          cmp -s /tmp/config-before/modules.conf /etc/asterisk/modules.conf 2>/dev/null || \
            test ! -e /tmp/config-before/modules.conf
          cmp -s /tmp/config-before/rpt.conf /etc/asterisk/rpt.conf 2>/dev/null || \
            test ! -e /tmp/config-before/rpt.conf
          dpkg-query -W -f='${Package} ${Version} ${Architecture}\n' \
            "$package" librnnoise0 librate-adjusting-pcm-ring1
