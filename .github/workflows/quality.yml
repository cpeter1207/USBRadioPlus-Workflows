name: Required quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Platform-independent quality
    runs-on: ubuntu-24.04
    container: ghcr.io/cpeter1207/usbradioplus-quality-debian13:latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out the shared playout ring
        uses: actions/checkout@v7
        with:
          repository: cpeter1207/rate_adjusting_pcm_ring
          ref: v1.0.1
          path: dependencies/rate_adjusting_pcm_ring
      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install matching modern ASL3 runtime
        uses: cpeter1207/USBRadioPlus-Workflows/actions/install-asl3-3105@main
      - name: Run independent quality checks concurrently
        env:
          RPCR_SOURCE: ${{ github.workspace }}/dependencies/rate_adjusting_pcm_ring
        run: |
          export PATH="/opt/usbradioplus-quality/bin:$PATH"
          make "$GITHUB_WORKSPACE/build/rpcr-stage/usr/lib/librate_adjusting_pcm_ring.so"
          set +e
          make lint & lint_pid=$!
          make static-analysis & static_pid=$!
          make docs & docs_pid=$!
          status=0
          for pid in "$lint_pid" "$static_pid" "$docs_pid"; do
            wait "$pid" || status=1
          done
          exit "$status"
      - name: Preserve Doxygen diagnostics
        if: always() && hashFiles('build/doxygen-warnings.log') != ''
        uses: actions/upload-artifact@v7
        with:
          name: doxygen-diagnostics
          path: build/doxygen-warnings.log
          if-no-files-found: error
  test:
    name: Debian 13 / ${{ matrix.arch }} / ${{ matrix.verification }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - debian: "13"
            arch: amd64
            runner: ubuntu-24.04
            verification: coverage
          - debian: "13"
            arch: arm64
            runner: ubuntu-24.04-arm
            verification: test-and-install
    runs-on: ${{ matrix.runner }}
    container: ghcr.io/cpeter1207/usbradioplus-quality-debian${{ matrix.debian }}:latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out the shared playout ring
        uses: actions/checkout@v7
        with:
          repository: cpeter1207/rate_adjusting_pcm_ring
          ref: v1.0.1
          path: dependencies/rate_adjusting_pcm_ring
      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Preserve the legacy ASL3 headers
        run: |
          mkdir -p /opt/asl-legacy/include/asterisk
          cp /usr/include/asterisk/res_usbradio.h /usr/include/asterisk/rpt_chan_shared.h \
            /opt/asl-legacy/include/asterisk/
      - name: Install matching modern ASL3 runtime
        uses: cpeter1207/USBRadioPlus-Workflows/actions/install-asl3-3105@main
      - name: Run platform-specific verification
        env:
          ASL_LEGACY_INCLUDEDIR: /opt/asl-legacy/include
          ASL_MODERN_INCLUDEDIR: /usr/include
          RPCR_SOURCE: ${{ github.workspace }}/dependencies/rate_adjusting_pcm_ring
        run: |
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/build/rpcr-stage/usr/lib:${LD_LIBRARY_PATH:-}"
          if [ '${{ matrix.verification }}' = coverage ]; then
            make platform-verify
          else
            make check
            make distcheck DISTCHECK_TEST_TARGET=
          fi
      - name: Upload Debian 13 amd64 coverage
        if: ${{ matrix.verification == 'coverage' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-debian${{ matrix.debian }}-${{ matrix.arch }}
          path: build/coverage
          if-no-files-found: error

  required:
    name: Required quality gate
    if: always()
    needs: [quality, test]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every platform
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          PLATFORM_RESULT: ${{ needs.test.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$PLATFORM_RESULT" = success
