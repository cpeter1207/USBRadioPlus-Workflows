name: Required quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Platform-independent quality
    runs-on: ubuntu-24.04
    container: ghcr.io/cpeter1207/usbradioplus-quality-debian13:latest
    steps:
      - uses: actions/checkout@v7
      - name: Install released shared dependencies
        uses: cpeter1207/USBRadioPlus-Workflows/actions/install-shared-dependencies@main
      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify baseline ASL3 runtime
        run: test "$(dpkg-query -W -f='${Version}' asl3-asterisk)" = '2:22.9.0+asl3-3.9.3-1.deb13'
      - name: Run independent quality checks concurrently
        run: |
          export PATH="/opt/usbradioplus-quality/bin:$PATH"
          set +e
          make lint & lint_pid=$!
          make static-analysis & static_pid=$!
          make docs & docs_pid=$!
          status=0
          for pid in "$lint_pid" "$static_pid" "$docs_pid"; do
            wait "$pid" || status=1
          done
          exit "$status"
      - name: Preserve Doxygen diagnostics
        if: always() && hashFiles('build/doxygen-warnings.log') != ''
        uses: actions/upload-artifact@v7
        with:
          name: doxygen-diagnostics
          path: build/doxygen-warnings.log
          if-no-files-found: error
  test:
    name: Debian 13 / ${{ matrix.arch }} / ${{ matrix.verification }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - debian: "13"
            arch: amd64
            runner: ubuntu-24.04
            verification: coverage
          - debian: "13"
            arch: arm64
            runner: ubuntu-24.04-arm
            verification: test-and-install
    runs-on: ${{ matrix.runner }}
    container: ghcr.io/cpeter1207/usbradioplus-quality-debian${{ matrix.debian }}:latest
    steps:
      - uses: actions/checkout@v7
      - name: Install released shared dependencies
        uses: cpeter1207/USBRadioPlus-Workflows/actions/install-shared-dependencies@main
      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify baseline ASL3 runtime
        run: test "$(dpkg-query -W -f='${Version}' asl3-asterisk)" = '2:22.9.0+asl3-3.9.3-1.deb13'
      - name: Run platform-specific verification
        run: |
          if [ '${{ matrix.verification }}' = coverage ]; then
            make platform-verify
          else
            make check
            make distcheck DISTCHECK_TEST_TARGET=
          fi
      - name: Upload Debian 13 amd64 coverage
        if: ${{ matrix.verification == 'coverage' && always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-debian${{ matrix.debian }}-${{ matrix.arch }}
          path: build/coverage
          if-no-files-found: error
      - name: Install RNNoise companion packages
        uses: cpeter1207/USBRadioPlus-Workflows/actions/install-rnnoise-packages@main
      - name: Build and install the single Debian package
        run: |
          DEB_BUILD_OPTIONS=nocheck dpkg-buildpackage -b -us -uc
          lintian --fail-on error ../usbradioplus_*.changes
          dpkg -i ../usbradioplus_*.deb
          module=$(find /usr/lib -path '*/asterisk/modules/chan_usbradioplus.so' -print -quit)
          test -n "$module"
          sha256sum "$module" > /tmp/usbradioplus-tested-module.sha256
          sh tests/container-smoke-test.sh
      - name: Install second supported ASL3 runtime
        uses: cpeter1207/USBRadioPlus-Workflows/actions/install-asl3-3105@main
      - name: Load the identical package under ASL3 3.10.5
        run: |
          sha256sum -c /tmp/usbradioplus-tested-module.sha256
          sh tests/container-smoke-test.sh


  required:
    name: Required quality gate
    if: always()
    needs: [quality, test]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every platform
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          PLATFORM_RESULT: ${{ needs.test.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$PLATFORM_RESULT" = success
