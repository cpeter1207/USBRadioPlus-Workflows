name: Release

on:
  workflow_call:
    inputs:
      release_version:
        description: Version already committed to main for release (for example, 0.1.0~alpha1)
        required: true
        type: string
      changes:
        description: Concise Markdown release notes
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        default: true
        type: boolean
    outputs:
      tag_name:
        description: Published Git tag
        value: ${{ jobs.release.outputs.tag_name }}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    outputs:
      tag_name: ${{ steps.release_metadata.outputs.tag_name }}
    runs-on: ubuntu-latest
    container: debian:13
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
      RELEASE_CHANGES: ${{ inputs.changes }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Install release tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates wget git gh

      - name: Check out main with complete history
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Trust the checked-out workspace
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install ASL3 repository and build dependencies
        shell: bash
        run: |
          set -euo pipefail
          wget -q -O /tmp/asl-apt-repos.deb \
            https://repo.allstarlink.org/public/asl-apt-repos.deb13_all.deb
          dpkg -i /tmp/asl-apt-repos.deb
          ./scripts/install-build-deps.sh

      - name: Validate release inputs
        id: release_metadata
        shell: bash
        run: |
          set -euo pipefail
          version_pattern='^[0-9][0-9A-Za-z.+:~_-]*$'
          [[ "$RELEASE_VERSION" =~ $version_pattern ]]
          test "$(cat VERSION)" = "$RELEASE_VERSION"
          test -n "${RELEASE_CHANGES//[[:space:]]/}"
          TAG_NAME="v$(printf '%s' "$RELEASE_VERSION" | tr '~' '-')"
          ASSET_VERSION="$(printf '%s' "$RELEASE_VERSION" | tr '~' '-')"
          ASSET_BASENAME="usbradioplus-$ASSET_VERSION.tar.xz"
          git check-ref-format "refs/tags/$TAG_NAME"
          git fetch origin main --tags --force
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          test "$RELEASE_COMMIT" = "$(git rev-parse origin/main)"
          printf 'TAG_NAME=%s\n' "$TAG_NAME" >> "$GITHUB_ENV"
          printf 'tag_name=%s\n' "$TAG_NAME" >> "$GITHUB_OUTPUT"
          printf 'ASSET_BASENAME=%s\n' "$ASSET_BASENAME" >> "$GITHUB_ENV"
          printf 'RELEASE_COMMIT=%s\n' "$RELEASE_COMMIT" >> "$GITHUB_ENV"
          printf '%s\n' "$RELEASE_CHANGES" > release-notes.md
          if git rev-parse --verify --quiet "refs/tags/$TAG_NAME"; then
            echo "Tag $TAG_NAME already exists." >&2
            exit 1
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists." >&2
            exit 1
          fi

      - name: Build and verify release archive
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make distcheck
          test -f "dist/usbradioplus-$RELEASE_VERSION.tar.xz"
          cp "dist/usbradioplus-$RELEASE_VERSION.tar.xz" "dist/$ASSET_BASENAME"
          (cd dist && sha256sum "$ASSET_BASENAME" > "$ASSET_BASENAME.sha256")

      - name: Publish release tag
        shell: bash
        run: |
          set -euo pipefail
          # Annotated release tags need a local identity even though the
          # authenticated GitHub token performs the network push.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" "$RELEASE_COMMIT" \
            -m "USBRadioPlus $RELEASE_VERSION"
          git push origin "refs/tags/$TAG_NAME"

      - name: Create GitHub release
        shell: bash
        run: |
          set -euo pipefail
          args=(release create "$TAG_NAME"
            --title "USBRadioPlus $RELEASE_VERSION"
            --notes-file release-notes.md
            "dist/$ASSET_BASENAME"
            "dist/$ASSET_BASENAME.sha256")
          if [[ "${{ inputs.prerelease }}" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
