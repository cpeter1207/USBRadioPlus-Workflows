name: Fast quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  preflight:
    name: Formatting, lint, and static analysis
    runs-on: ubuntu-24.04
    container: ghcr.io/cpeter1207/usbradioplus-quality-debian13:latest
    steps:
      - uses: actions/checkout@v7
      - name: Install released shared dependencies
        uses: cpeter1207/USBRadioPlus-Workflows/actions/install-shared-dependencies@main
      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify baseline ASL3 runtime
        run: test "$(dpkg-query -W -f='${Version}' asl3-asterisk)" = '2:22.9.0+asl3-3.9.3-1.deb13'
      - name: Run formatting, lint, and static analysis concurrently
        run: |
          export PATH="/opt/usbradioplus-quality/bin:$PATH"
          set +e
          make lint & lint_pid=$!
          make static-analysis & static_pid=$!
          status=0
          for pid in "$lint_pid" "$static_pid"; do
            wait "$pid" || status=1
          done
          exit "$status"

  required:
    name: Fast quality
    if: always()
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - name: Require preflight success
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
        run: test "$PREFLIGHT_RESULT" = success
