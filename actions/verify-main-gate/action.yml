name: Verify previously tested main revision
description: Require a merged main revision whose pull request passed both complete production gates.

runs:
  using: composite
  steps:
    - name: Verify merged source and completed pull-request gates
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # Retry only failed API/JSON reads, never merged-source or gate predicates.
        api_json() {
          local stage=$1 attempt response
          shift
          for attempt in 1 2 3; do
            printf 'Reading %s (attempt %s/3)\n' "$stage" "$attempt" >&2
            if response=$(gh api "$@") &&
              jq -e -s 'length > 0' <<< "$response" >/dev/null; then
              printf '%s\n' "$response"
              return 0
            fi
            if test "$attempt" -lt 3; then sleep "$attempt"; fi
          done
          return 1
        }
        git fetch origin main
        commit=$(git rev-parse HEAD)
        git merge-base --is-ancestor "$commit" origin/main
        metadata=$(api_json 'merged pull-request metadata' \
          "repos/$GITHUB_REPOSITORY/commits/$commit/pulls")
        head=$(jq -er --arg commit "$commit" '
          [.[] | select(.merged_at != null and .base.ref == "main" and
            .merge_commit_sha == $commit)] |
          if length == 1 then .[0].head.sha else error("source is not a merged main revision") end
        ' <<< "$metadata")
        checks=$(api_json 'required check-run metadata' --paginate \
          "repos/$GITHUB_REPOSITORY/commits/$head/check-runs?per_page=100" |
          jq -s '[.[].check_runs[]]')
        for gate in 'Required quality gate' 'Required container gate'; do
          jq -e --arg gate "$gate" '
            [.[] | select(.name | endswith($gate))] | sort_by(.id) | last |
            .status == "completed" and .conclusion == "success"
          ' <<< "$checks"
        done
